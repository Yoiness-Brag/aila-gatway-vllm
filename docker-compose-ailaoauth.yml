services:
  aila-oauth-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aila-oauth-gateway
    env_file: .env
    environment:
      AILA_OAUTH_MODE: ${AILA_OAUTH_MODE}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REQUIRE_AUTH: ${REQUIRE_AUTH}
      RUST_LOG: ${RUST_LOG}
      PORT: ${PORT}
      MANAGEMENT_PORT: ${MANAGEMENT_PORT}
    ports:
      - "3000:3000"
      - "8080:8080"
    volumes:
      - ./config.yml:/app/config.yml:ro
    networks:
      - default
    external_links:
      - aila-oauth-postgres:postgres

networks:
  default:
    name: api-getway-ocr-ci_aila-oauth-network
    external: true
